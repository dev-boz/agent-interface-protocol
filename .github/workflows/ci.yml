name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, spec-v2-unified-update]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Install verified IMX integration dependency
        if: matrix.python-version != '3.10'
        run: |
          pip install 'git+https://github.com/dev-boz/IMX.git@933448e244469a08cb3f0df3e4a0ec1ea7deffab'
          python -c 'from imx.correlation import correlate_workspace'

      - name: Run tests
        run: python -m pytest tests/ -x -q --tb=short

      - name: Run live tmux and MCP core tests
        env:
          AIP_RUN_LIVE_TMUX: '1'
        run: timeout 120 python -m pytest tests/integration/test_live_core.py -q --tb=short
